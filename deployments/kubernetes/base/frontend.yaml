apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectors-frontend
  labels:
    app.kubernetes.io/name: connectors-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connectors-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connectors-frontend
    spec:
      containers:
        - name: frontend
          image: industrial-automation-connectors:frontend-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: connectors-frontend
spec:
  selector:
    app.kubernetes.io/name: connectors-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
