apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectors-gateway
  labels:
    app.kubernetes.io/name: connectors-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: connectors-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connectors-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: industrial-automation-connectors:gateway-dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_SERVICE_NAME
              value: gateway
            - name: GATEWAY_HTTP_ADDR
              value: :8081
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 1
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: connectors-gateway
spec:
  selector:
    app.kubernetes.io/name: connectors-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
